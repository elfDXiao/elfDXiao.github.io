  <script>
  /* 首页魔兽地图：悬停高亮 + 点击进入 + 键盘 1–6 + 首屏隐藏顶栏 */
  (function () {
    'use strict';
    var map = document.querySelector('.wowmap');
    if (!map) return;
    var BASE = (location.protocol === 'file:') ? 'https://elfdxiao.github.io/' : '';
    var regions = [].slice.call(map.querySelectorAll('a.region'));
    var items = {};
    [].forEach.call(map.querySelectorAll('.tipitem'), function (el) { items[el.dataset.id] = el; });

    function show(r) {
      var k = r.dataset.id;
      for (var kk in items) items[kk].classList.toggle('show', kk === k);
      map.classList.add('lit');
    }
    function reset() {
      regions.forEach(function (x) { x.classList.remove('on'); });
      map.classList.remove('lit');
    }
    regions.forEach(function (r) {
      r.addEventListener('mouseenter', function () { show(r); });
      r.addEventListener('mouseleave', reset);
      r.addEventListener('focus', function () { show(r); });
      r.addEventListener('click', function (e) {
        e.preventDefault();
        location.href = BASE + r.dataset.href;
      });
    });
    document.addEventListener('keydown', function (e) {
      var i = parseInt(e.key, 10);
      if (i >= 1 && i <= regions.length) {
        reset();
        var r = regions[i - 1];
        r.classList.add('on'); show(r);
      }
      if (e.key === 'Escape') reset();
    });
  })();
  </script>
