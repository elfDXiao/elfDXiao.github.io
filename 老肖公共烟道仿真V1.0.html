/* ---------- 魔兽石框面板（可拖动） ---------- */
.panel{position:absolute;z-index:8;
  background:linear-gradient(180deg,rgba(26,20,12,.94),rgba(17,13,8,.95));
  border:1px solid var(--w-gold-d);border-radius:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.65), inset 0 0 0 1px rgba(200,165,72,.20),
    inset 0 18px 40px rgba(0,0,0,.35), 0 16px 44px rgba(0,0,0,.50)}
#left{left:14px;top:14px;bottom:14px;width:242px;padding:14px 12px;overflow-y:auto;overflow-x:hidden}
#right{right:14px;top:14px;bottom:14px;width:322px;padding:14px;overflow-y:auto;overflow-x:hidden}
#center{left:268px;right:348px;top:14px;bottom:14px;display:flex;flex-direction:column;padding:0;overflow:hidden}
#ctools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(110,90,38,.55);flex:none;
  box-shadow:0 1px 0 rgba(200,165,72,.14)}
#ctools .cbrand{font-family:var(--serif);font-size:12.5px;color:var(--w-gold);letter-spacing:.18em;white-space:nowrap}
#ctools .csp{flex:1}
#cview{flex:1;position:relative;overflow:hidden}
#v3c{position:absolute;inset:0;display:block;width:100%;height:100%}
#cview #v3hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-track{background:rgba(0,0,0,.35);border-radius:5px}
.panel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#8a6d2f,#5c4a1c);border-radius:5px;border:1px solid #2a2110}
.panel::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#c8a548,#8a6d2f)}

#logo{display:flex;align-items:center;gap:9px;margin:2px 4px 12px;padding-bottom:10px;
  border-bottom:1px solid rgba(110,90,38,.55);box-shadow:0 1px 0 rgba(200,165,72,.14)}
#logo b{font-family:var(--serif);font-size:17px;letter-spacing:.10em;
  background:linear-gradient(90deg,#f0d68a,#c8a548);-webkit-background-clip:text;background-clip:text;
  color:transparent;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#logo small{color:var(--w-mut2);font-size:10.5px}
.dotlogo{width:12px;height:12px;border-radius:3px;flex:none;
  background:linear-gradient(135deg,#f0d68a,#8a6d2f);box-shadow:0 0 12px rgba(232,201,106,.55),inset 0 0 3px rgba(0,0,0,.4)}
h2{font-family:var(--serif);font-size:11.5px;color:var(--w-gold);letter-spacing:.24em;margin:14px 6px 7px;
  font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
button{display:flex;align-items:center;gap:8px;width:100%;margin:3px 0;padding:8px 10px;
  border:1px solid #4a3c1c;border-radius:5px;cursor:pointer;font:12.5px/1 inherit;
  background:linear-gradient(180deg,#3a2f16,#261e0d);color:#d9c68e;
  transition:all .15s;text-shadow:0 1px 2px rgba(0,0,0,.5)}
button:hover{background:linear-gradient(180deg,#57431c,#33280f);border-color:var(--w-gold);color:var(--w-gold-l)}
button.on{background:linear-gradient(180deg,#5c4a1c,#3a2f10);border-color:var(--w-gold-l);
  color:var(--w-gold-l);font-weight:700;box-shadow:0 0 14px rgba(200,165,72,.35),inset 0 0 10px rgba(200,165,72,.15)}
label{display:block;margin:7px 2px 2px;font-size:12.5px;color:var(--w-mut);letter-spacing:.04em}
input,select{width:100%;padding:6px 9px;border:1px solid #4a3c1c;border-radius:5px;
  background:rgba(0,0,0,.35);color:var(--w-txt);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--w-gold);box-shadow:0 0 10px rgba(200,165,72,.28)}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--w-gold);height:22px}
.row2{display:flex;gap:8px}.row2>div{flex:1}

/* ---------- 户卡片（技能槽风） ---------- */
.uci{background:var(--w-bg2);border:1px solid #4a3c1c;border-radius:5px;padding:10px 11px;
  margin-bottom:10px;position:relative;box-shadow:inset 0 1px 0 rgba(200,165,72,.10)}
.uci.f3{border:1.5px solid var(--w-gold);
  box-shadow:0 0 16px rgba(200,165,72,.28), inset 0 0 12px rgba(200,165,72,.10)}
.uci .hd{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.uci .hd b{font-family:var(--serif);font-size:17px;letter-spacing:.06em;color:var(--w-gold-l);
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.uci .hd .tag{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.30);
  color:var(--w-mut);border:1px solid #4a3c1c;white-space:nowrap}
.uci .hd .tag.cn{background:rgba(224,87,60,.14);color:#e88a6a;border-color:rgba(224,87,60,.45)}
.uci .hd .tag.jp{background:rgba(74,144,194,.14);color:#7ab3d8;border-color:rgba(74,144,194,.45)}
.uci .sw{margin-left:auto;flex:none}
#ucards.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ucards.two .uci{margin-bottom:0}
.qbar{height:8px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:6px;
  border:1px solid rgba(74,60,28,.8)}
.qbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4a90c2,#61a35f);
  transition:width .25s;box-shadow:0 0 8px rgba(74,144,194,.4)}
.qbar.warn i{background:linear-gradient(90deg,#d98a3a,#e0573c);box-shadow:0 0 8px rgba(217,138,58,.4)}
.qbar.dead i{background:linear-gradient(90deg,#e0573c,#8a2415);box-shadow:0 0 8px rgba(224,87,60,.45)}
.qread{display:flex;justify-content:space-between;font-size:11.5px;color:var(--w-mut);margin-top:3px;
  font-variant-numeric:tabular-nums}
.qread b{color:var(--w-txt);font-weight:600}
.qread .rd{color:var(--red);font-weight:600}
/* 开关（金/石） */
.sw{position:relative;width:38px;height:21px;border-radius:11px;background:#2a2110;
  border:1px solid #4a3c1c;cursor:pointer;transition:all .2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(135deg,#d9c68e,#8a6d2f);box-shadow:0 1px 4px rgba(0,0,0,.5);transition:left .2s}
.sw.on{background:#3d5c2a;border-color:#61a35f}
.sw.on::after{left:19px;background:linear-gradient(135deg,#b8e08a,#61a35f)}
/* 国籍切换 */
.kbtn{width:auto;margin:0;padding:4px 11px;font-size:12.5px;border-radius:4px;
  border:1px solid #4a3c1c;background:linear-gradient(180deg,#3a2f16,#261e0d);color:#b5a886;flex:none}
.kbtn.on{border-color:var(--w-gold-l);background:linear-gradient(180deg,#5c4a1c,#3a2f10);
  color:var(--w-gold-l);font-weight:700;box-shadow:0 0 10px rgba(200,165,72,.30)}
.lkbtn{width:auto;margin:0;padding:3px 9px;font-size:11.5px;border-radius:4px;
  border:1px solid #4a3c1c;background:rgba(0,0,0,.28);color:var(--w-mut)}
.lkbtn.on{border-color:rgba(224,87,60,.55);background:rgba(224,87,60,.14);color:#e88a6a;font-weight:600}
.fbtn{width:auto;margin:0 0 0 auto;padding:2px 9px;font-size:11px;border-radius:4px;
  border:1px solid var(--w-gold-d);background:rgba(200,165,72,.08);color:var(--w-gold);flex:none;cursor:pointer}
.fbtn:hover{border-color:var(--w-gold);color:var(--w-gold-l);box-shadow:0 0 10px rgba(200,165,72,.25)}

/* ---------- 右栏卡片（观察buff风） ---------- */
.card{background:var(--w-bg2);border:1px solid #4a3c1c;border-radius:5px;padding:11px 12px;
  margin-bottom:11px;box-shadow:inset 0 1px 0 rgba(200,165,72,.10)}
.card h3{font-family:var(--serif);font-size:12.5px;color:var(--w-gold);letter-spacing:.26em;
  font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(110,90,38,.5);
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.big{font-family:var(--serif);font-size:28px;line-height:1.15;font-weight:500;color:var(--w-gold-l);
  font-variant-numeric:tabular-nums;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.big small{font-size:12px;color:var(--w-mut);font-weight:400}
.brow{display:flex;align-items:center;gap:8px;padding:5.5px 2px;border-bottom:1px dashed rgba(200,165,72,.14)}
.brow:last-child{border:none}
.brow .nm{flex:1;color:var(--w-mut);font-size:13.5px}
.brow .nm small{color:var(--w-mut2);font-size:11px}
.brow .v{color:var(--w-mut);font-variant-numeric:tabular-nums;font-size:13.5px}
.brow .v b{color:var(--w-txt)}
.pbar{display:inline-block;width:74px;height:7px;border-radius:4px;background:rgba(0,0,0,.45);
  overflow:hidden;vertical-align:middle;margin-right:3px;border:1px solid rgba(74,60,28,.8)}
.pbar i{display:block;height:100%}
.badge{display:inline-block;padding:4px 14px;border-radius:4px;font-size:13px;font-weight:700;
  letter-spacing:.10em;font-family:var(--serif)}
.badge.ok{background:rgba(97,163,95,.14);color:#8fd08a;border:1px solid rgba(97,163,95,.55)}
.badge.warn{background:rgba(217,138,58,.14);color:#eab064;border:1px solid rgba(217,138,58,.5)}
.badge.bad{background:rgba(224,87,60,.14);color:#ef8468;border:1px solid rgba(224,87,60,.6);
  animation:blink 1.1s infinite;text-shadow:0 0 8px rgba(224,87,60,.5)}
.badge.off{background:rgba(0,0,0,.25);color:var(--w-mut2);border:1px solid #4a3c1c}
@keyframes blink{50%{opacity:.5}}

/* ---------- 顶栏（动作条风） ---------- */
#topbar{display:none}

#ctools button{width:auto;margin:0;padding:5px 13px;font-size:13px;border-radius:4px;flex:none;
  border:1px solid #4a3c1c;background:linear-gradient(180deg,#3a2f16,#261e0d);color:#d9c68e}
#ctools button:hover{filter:brightness(1.3);border-color:var(--w-gold)}
#ctools select{width:auto;padding:5px 8px;font-size:13px;border-radius:4px}


/* ---------- 3D DOM 标签（保留结构；当前未启用） ---------- */
#lbls{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11.5px;
  background:rgba(20,15,10,.85);border:1px solid var(--w-gold-d);border-radius:4px;
  padding:2px 8px;color:var(--w-txt);font-variant-numeric:tabular-nums}

/* ---------- 提示/模态（魔兽任务框风） ---------- */
#v3hint{
  background:linear-gradient(180deg,rgba(26,20,12,.92),rgba(17,13,8,.94));
  border:1px solid var(--w-gold-d);border-radius:5px;color:var(--w-mut);padding:7px 18px;
  font-size:12.5px;box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(200,165,72,.15);
  pointer-events:none;white-space:nowrap;letter-spacing:.05em}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;
  align-items:center;justify-content:center}
#modal .box{width:460px;max-height:82vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(30,23,14,.97),rgba(18,14,9,.98));
  border:1px solid var(--w-gold);border-radius:6px;padding:22px 24px;
  box-shadow:0 0 0 1px rgba(0,0,0,.7), inset 0 0 0 1px rgba(200,165,72,.25),
    0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(200,165,72,.12)}
#modal h3{font-family:var(--serif);font-size:15px;margin-bottom:12px;color:var(--w-gold-l);
  letter-spacing:.12em;text-shadow:0 2px 6px rgba(0,0,0,.7), 0 0 20px rgba(200,165,72,.35);
  text-align:center}
#modal .mb{font-size:12.5px;color:var(--w-txt);line-height:1.95}
#modal .mb b{color:var(--w-gold-l)}
#modal .mb .k{color:var(--w-gold);font-weight:600}
#modal .box::-webkit-scrollbar{width:9px}
#modal .box::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#8a6d2f,#5c4a1c);border-radius:5px}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns button{justify-content:center;margin:0;font-family:var(--serif);font-size:12.5px;letter-spacing:.2em}
.mbtns .pri{background:linear-gradient(180deg,#8a6d2f,#5c4a1c);border:1px solid var(--w-gold-l);
  color:#ffe9a8;font-weight:700;box-shadow:0 0 16px rgba(200,165,72,.4)}
.mbtns .pri:hover{background:linear-gradient(180deg,#c8a548,#8a6d2f);color:#fff8e0}
#toast{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:15;
  background:linear-gradient(180deg,rgba(34,26,16,.96),rgba(22,17,10,.97));color:var(--w-gold-l);
  padding:10px 20px;border-radius:5px;font-size:13px;font-family:var(--serif);letter-spacing:.06em;
  border:1px solid var(--w-gold-d);
  box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(200,165,72,.20), 0 10px 30px rgba(0,0,0,.5);
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:70%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="panel" id="center">
  <div id="ctools">
    <span class="cbrand">公共烟道 · 五层五户 · 任意焦点层</span>
    <span class="csp"></span>
    <select id="riserSel">
      <option value="std">标准烟道 320×420</option>
      <option value="old">老旧烟道 240×240</option>
      <option value="big">大截面 350×450</option>
    </select>
    <button id="b_help2">说 明</button>
  </div>
  <div id="cview">
    <canvas id="v3c"></canvas>
    <div id="lbls"></div>
    <div id="v3hint">左/右键拖动转视角 · 滚轮缩放 · W/S 前进后退 · A/D 左右平移</div>
  </div>
</div>

<div class="panel" id="left">
 <div id="logo"><div class="dotlogo"></div><b>老肖公共烟道仿真</b><small>V1.0</small></div>
 <div id="ucards"></div>
 <h2>图例</h2>
 <div style="font-size:12.5px;color:var(--w-mut);line-height:2.0;padding:2px 4px">
  <div><span style="color:#ef8468;font-weight:600">红压柱</span>＝烟道正压(背压)</div>
  <div><span style="color:#7ab3d8;font-weight:600">蓝压柱</span>＝烟道负压(抽吸)</div>
  <div>机侧压 − 烟道侧压 &gt; 0 → 止逆阀开</div>
  <div style="color:var(--w-mut2)">*动画粒子速度为示意缩放</div>
 </div>
</div>

<div class="panel" id="right">
 <div class="card"><h3>焦点层 止逆阀监测</h3>
  <div id="f3mon"></div>
 </div>
 <div class="card"><h3>烟道节点压力</h3><div id="pdist"></div></div>
 <div class="card"><h3>系统总览</h3><div id="sysinfo"></div></div>
</div>

<div id="v3hint">视角已锁定（正立面） · 拖工具箱空白处可移动</div>
<div id="modal"><div class="box"><h3 id="m_title"></h3><div class="mb" id="m_body"></div>
 <div class="mbtns"><button id="m_ok" class="pri">开 始</button></div></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   老肖的公共烟道仿真 V1.0
   五层住宅（1F–5F）· 公共烟道 · 任意焦点层
   ============================================================ */
const $ = id => document.getElementById(id);

/* ---------- 物理常量 ---------- */
const G = 9.81, R_AIR = 287.05;
const FLOOR_H = 3.0;          // 层高 m
const NODE_Z = 2.45;          // 支管接入烟道高度（层内）
const TOP_EXIT_Z = 5 * FLOOR_H + 1.6; // 烟道出屋面总高 16.6m
const BR_A = Math.PI * 0.075 * 0.075; // DN150 支管截面积
const BR_ZETA = 1.3;          // 支管综合局部阻力（弯头+沿程+阀全开）
const EXIT_ZETA = 0.6;        // 出口（变径+伞形风帽）
const FLOOR_IDS = [1, 2, 3, 4, 5]; // 物理层0..4，从下到上 1F–5F
const F3 = 2;                 // 3F 物理序号

const RISER_KINDS = {
  old: { name: "老旧烟道 240×240", w: 0.24, h: 0.24, lambda: 0.024 },
  std: { name: "标准烟道 320×420", w: 0.32, h: 0.42, lambda: 0.018 },
  big: { name: "大截面 350×450", w: 0.35, h: 0.45, lambda: 0.016 }
};
let riser = RISER_KINDS.std;
function riserGeom() {
  const A = riser.w * riser.h, Dh = 2 * riser.w * riser.h / (riser.w + riser.h);
  return { A, Dh, lambda: riser.lambda };
}
function rho(t) { return 101325 / (R_AIR * (t + 273.15)); }

/* ---------- 全局状态 ---------- */
const ST = {
  tAmb: 20, tSmoke: 45,
  units: FLOOR_IDS.map((id, i) => ({
    id, phys: i, on: i === F3, qMax: 900, pMax: 480, kind: "CN", leak: 0,
    Q: 0, Qdisp: 0, Pnode: 0, leakQ: 0, valveTh: 0
  }))
};
ST.units[F3].kind = "CN";
ST.focus = F3; // 观察焦点层（可切换，默认 3F）
const LEAKS = { 0: { n: "完好", a: 0 }, 1: { n: "老化", a: 6e-4 }, 2: { n: "失效", a: 15e-4 } };
let R = null; // 最近一次求解结果

/* ---------- 求解器（与验证版一致） ---------- */
function nodeZ(i) { return i * FLOOR_H + NODE_Z; }
function solve() {
  const rs = rho(ST.tSmoke), ra = rho(ST.tAmb);
  const RG = riserGeom();
  const K = BR_ZETA * 0.5 * rs / (BR_A * BR_A) / (3600 * 3600); // Pa/(m³/h)² 总
  const KD = 0.8 * 0.5 * rs / (BR_A * BR_A) / (3600 * 3600);    // 管段部分(弯头+沿程)
  // KV = K-KD 为阀本体局部阻力
  const P = new Array(5).fill(0);
  const Q = ST.units.map(u => u.on ? u.qMax * 0.7 : 0);
  const segQ = new Array(5).fill(0); // segQ[k]: 物理层k上方竖井段流量
  for (let it = 0; it < 400; it++) {
    // 节点压力（从出口向下）
    { // 顶部段：6F 节点 → 出口
      const Qtot = Q.reduce((a, b) => a + b, 0) - ST.units.reduce((a, u) => a + u.leakQ, 0);
      segQ[4] = Qtot;
      const v = Qtot / 3600 / RG.A;
      const L = TOP_EXIT_Z - nodeZ(4);
      P[4] = EXIT_ZETA * 0.5 * rs * v * v + RG.lambda / RG.Dh * 0.5 * rs * v * v * L - (ra - rs) * G * L;
    }
    for (let k = 3; k >= 0; k--) {
      const Qseg = Q.slice(0, k + 1).reduce((a, b) => a + b, 0)
        - ST.units.slice(0, k + 1).reduce((a, u) => a + u.leakQ, 0);
      segQ[k] = Qseg;
      let dp = 0;
      if (Qseg > 1) { // 有流才有摩擦+浮力，静止段传压
        const v = Qseg / 3600 / RG.A;
        dp = RG.lambda / RG.Dh * 0.5 * rs * v * v * FLOOR_H - (ra - rs) * G * FLOOR_H;
      }
      P[k] = P[k + 1] + dp;
    }
    // 每户工况点
    let maxd = 0;
    ST.units.forEach((u, i) => {
      let nq = 0;
      if (u.on) {
        const num = u.pMax - P[i];
        if (num > 0) nq = Math.sqrt(num / (u.pMax / (u.qMax * u.qMax) + K));
      }
      u.leakQ = 0;
      if (u.leak > 0 && P[i] > 0 && nq <= 0.5) { // 阀关且烟道正压 → 渗漏倒灌
        u.leakQ = 0.6 * u.leak * Math.sqrt(2 * P[i] / rs) * 3600;
      }
      maxd = Math.max(maxd, Math.abs(nq - Q[i]));
      Q[i] = Q[i] * 0.45 + nq * 0.55;
      u.Q = Q[i]; u.Pnode = P[i];
    });
    if (maxd < 0.01) break;
  }
  const Qtot = Q.reduce((a, b) => a + b, 0);
  const rs_ = rho(ST.tSmoke);
  R = {
    P, Q: ST.units.map(u => u.Q), segQ, Qtot,
    vTop: Qtot / 3600 / riserGeom().A,
    exitLoss: EXIT_ZETA * 0.5 * rs_ * Math.pow(Qtot / 3600 / riserGeom().A, 2),
    buoy: (rho(ST.tAmb) - rs_) * G * TOP_EXIT_Z,
    rhoS: rs_, K
  };
  // 3F 阀前后压力：阀前=阀片上游支管静压(风机压-管段损失)；停机/憋停=风机闭压
  const f3 = ST.units[ST.focus];
  if (f3.on && f3.Q > 0.5) {
    R.f3ValveUp = f3.pMax * (1 - Math.pow(f3.Q / f3.qMax, 2)) - KD * f3.Q * f3.Q;
  } else R.f3ValveUp = f3.on ? f3.pMax : 0;
  R.f3ValveDown = f3.Pnode; // 烟道侧(阀后)
  R.f3ValveDp = R.f3ValveUp - R.f3ValveDown;
  return R;
}

/* ---------- 焦点层状态判定 ---------- */
function f3Status() {
  const u = ST.units[ST.focus];
  if (!u.on) {
    if (u.leakQ > 0.3) return { c: "bad", t: "倒灌串味", d: "烟道正压经失效止逆阀渗入 3F 厨房" };
    return { c: "off", t: "停机 · 阀密封良好", d: "止逆阀关闭且无泄漏" };
  }
  const fr = u.Q / u.qMax;
  if (u.Q < 8) return { c: "bad", t: "憋停", d: "烟道背压 ≥ 风机最大静压，排量趋零" };
  if (fr >= 0.9) return { c: "ok", t: "畅排", d: "工况点接近额定" };
  if (fr >= 0.6) return { c: "warn", t: "风量衰减", d: "烟道背压使工况点左移" };
  return { c: "bad", t: "重衰减", d: "背压严重压制排量" };
}

/* ---------- UI 生成 ---------- */
function flagEmoji(kind) { return kind === "JP" ? "🇯🇵" : "🇨🇳"; }
function buildCards() {
  const box = $("ucards"); box.innerHTML = "";
  ST.units.forEach((u, i) => {
    const d = document.createElement("div");
    d.className = "uci" + (i === ST.focus ? " f3" : "");
    d.id = "uc" + i;
    d.innerHTML = `
      <div class="hd">
        <b>${u.id}F</b>

const _flagCache = {};
function flagTex(kind) {
  if (_flagCache[kind]) return _flagCache[kind];
  const c = document.createElement("canvas"); c.width = 129; c.height = 86;
  const x = c.getContext("2d");
  if (kind === "JP") {
    x.fillStyle = "#fff"; x.fillRect(0, 0, 129, 86);
    x.fillStyle = "#bc002d"; x.beginPath(); x.arc(64.5, 43, 26, 0, 7); x.fill();
    x.strokeStyle = "#c8c2b6"; x.lineWidth = 2; x.strokeRect(1, 1, 127, 84);
  } else {
    x.fillStyle = "#de2910"; x.fillRect(0, 0, 129, 86);
    const star = (cx, cy, r, rot) => {
      x.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = rot + i * 2 * Math.PI / 5 - Math.PI / 2;
        const a2 = a + Math.PI / 5;
        x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        x.lineTo(cx + Math.cos(a2) * r * 0.382, cy + Math.sin(a2) * r * 0.382);
      }
      x.closePath(); x.fillStyle = "#ffde00"; x.fill();
    };
    const sc = 129 / 30, sy = 86 / 20; // 30×20 网格
    const big = [5 * sc, 5 * sy];
    star(big[0], big[1], 3.15 * sc, 0);
    [[10, 2], [12, 4], [12, 7], [10, 9]].forEach(p => {
      const cx = p[0] * sc, cy = p[1] * sy;
      const rot = Math.atan2(big[1] - cy, big[0] - cx);
      star(cx, cy, 1.05 * sc, rot);
    });
    x.strokeStyle = "rgba(0,0,0,.15)"; x.lineWidth = 2; x.strokeRect(1, 1, 127, 84);
  }
  const t = new THREE.CanvasTexture(c);
  _flagCache[kind] = t; return t;
}

function disposeGroup(g) { g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }

/* ---------- 粒子系统 ---------- */
const PN = 8000;
const PPOS = new Float32Array(PN * 3), PCOL = new Float32Array(PN * 3);
const PSTG = new Uint8Array(PN), PUI = new Uint8Array(PN), PS = new Float32Array(PN),
  PLT = new Float32Array(PN), PVX = new Float32Array(PN),
  PVY = new Float32Array(PN), PVZ = new Float32Array(PN), AGE = new Float32Array(PN);
const STG = { FREE: 0, KITCHEN: 1, BRANCH: 2, RISER: 3, PLUME: 4, BF_PIPE: 5, BF_ROOM: 6 };
const UCOL = [ // 各层荧光油烟色（高饱和，竖井中一眼分辨"哪层的烟"）
  [1.00, 0.92, 0.00], // 1F 荧光金
  [1.00, 0.56, 0.00], // 2F 亮橙
  [1.00, 0.20, 0.05], // 3F 霓虹红（焦点层）
  [1.00, 0.20, 0.85], // 4F 荧光品红
  [0.62, 0.25, 1.00], // 5F 电紫
];
let spawnAcc = [0, 0, 0, 0, 0], bfAcc = 0;
function initParticles() {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(PPOS, 3));
  g.setAttribute("color", new THREE.BufferAttribute(PCOL, 3));
  const sprite = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d"); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 30);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.18, "rgba(255,255,255,.95)");
    gr.addColorStop(.34, "rgba(255,255,255,.62)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  V3.pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.165, map: sprite,
    vertexColors: true, transparent: true, opacity: 1, depthWrite: false, sizeAttenuation: true }));
  V3.pts.renderOrder = 10; // 画在半透明烟道盒之后 → 不被蒙灰，色彩最鲜
  V3.pts.frustumCulled = false;
  for (let i = 0; i < PN; i++) { PSTG[i] = STG.FREE; AGE[i] = -1; PPOS[i * 3 + 1] = -99; }
  V3.scene.add(V3.pts);
}
function segFlowV(y) { // 烟道内 y 处的段流速（视觉前先得真实值）
  if (!R) return 0;
  const k = Math.max(0, Math.min(4, Math.floor((y - 2.45) / 3)));
  return R.segQ[k] / 3600 / riserGeom().A;
}
function spawnKitchen(i) {
  const idx = allocP(); if (idx < 0) return;
  const u = ST.units[i];
  PSTG[idx] = STG.KITCHEN; PUI[idx] = i; AGE[idx] = 0; PLT[idx] = 3.2;
  PPOS[idx * 3] = STX + (Math.random() - 0.5) * 0.85;
  PPOS[idx * 3 + 1] = i * FLOOR_H + 1.0 + Math.random() * 0.25;
  PPOS[idx * 3 + 2] = STZ + (Math.random() - 0.5) * 0.4;
  PVX[idx] = (Math.random() - 0.5) * 0.12; PVZ[idx] = (Math.random() - 0.5) * 0.12;
  PVY[idx] = 0.5 + Math.random() * 0.35;
  const uc = UCOL[i % UCOL.length], vr = 0.88 + Math.random() * 0.24; // 楼层色±12%明度
  PCOL[idx * 3] = uc[0] * vr; PCOL[idx * 3 + 1] = uc[1] * vr; PCOL[idx * 3 + 2] = uc[2] * vr;
}
function spawnBackflow() {
  const idx = allocP(); if (idx < 0) return;
  PSTG[idx] = STG.BF_PIPE; PUI[idx] = ST.focus; AGE[idx] = 0; PLT[idx] = 9;
  PS[idx] = VALVE_S - 0.03;
  PPOS[idx * 3] = 3.85; PPOS[idx * 3 + 1] = ST.focus * FLOOR_H + 2.45; PPOS[idx * 3 + 2] = STZ + (Math.random() - 0.5) * 0.05;
  PVY[idx] = 0; PVX[idx] = 0; PVZ[idx] = 0;
  PCOL[idx * 3] = .88; PCOL[idx * 3 + 1] = .32; PCOL[idx * 3 + 2] = .2;
}
function allocP() {
  for (let t = 0; t < 24; t++) {
    const i = (Math.random() * PN) | 0;
    if (PSTG[i] === STG.FREE) return i;
  }
  return -1;
}
function killP(i) { PSTG[i] = STG.FREE; AGE[i] = -1; PPOS[i * 3 + 1] = -99; }

/* 粒子推进 */
function updateParticles(dt) {
  // 生成
  ST.units.forEach((u, i) => {
    if (!u.on || u.Qdisp < 4) return;
    const rate = (u.kind === "JP" ? 12 : 42) * (0.35 + 0.65 * Math.min(1, u.Qdisp / u.qMax));
    spawnAcc[i] += rate * dt;
    while (spawnAcc[i] >= 1) { spawnAcc[i] -= 1; spawnKitchen(i); }
  });
  if (ST.units[ST.focus].leakQ > 0.3) {
    bfAcc += Math.min(34, ST.units[ST.focus].leakQ * 0.7) * dt;
    while (bfAcc >= 1) { bfAcc -= 1; spawnBackflow(); }
  }
  const wind = 0.22;
  for (let i = 0; i < PN; i++) {
    const st = PSTG[i]; if (st === STG.FREE) continue;
    AGE[i] += dt; if (AGE[i] > PLT[i]) { killP(i); continue; }
    const i3 = i * 3, ui = PUI[i], u = ST.units[ui], y0 = ui * FLOOR_H;
    if (st === STG.KITCHEN) {
      const yb = y0 + HOOD_BOT - 0.1;
      let x = PPOS[i3], y = PPOS[i3 + 1], z = PPOS[i3 + 2];
      if (y > yb) { // 吸入锥
        const k = Math.min(1, dt * 5.5);
        x += (STX - x) * k; z += (STZ - z) * k;
        y += (PVY[i] + 0.9) * dt;
      } else {
        x += (PVX[i] + (Math.random() - .5) * .1) * dt * 2.4;
        z += (PVZ[i] + (Math.random() - .5) * .1) * dt * 2.4;
        y += PVY[i] * dt;
      }
      if (y > y0 + HOOD_TOP) { PSTG[i] = STG.BRANCH; PS[i] = 0.43; PLT[i] = AGE[i] + 9; }
      PPOS[i3] = x; PPOS[i3 + 1] = y; PPOS[i3 + 2] = z;
    } else if (st === STG.BRANCH) {
      const vb = Math.max(0.35, Math.min(3, (u.Qdisp / 3600 / BR_A) * 0.34));
      PS[i] += vb * dt;
      if (PS[i] >= BR_TOT) { // 入烟道：重置寿命，保证整条竖井可见（顶层能看到下层各色的烟）
        PSTG[i] = STG.RISER; PLT[i] = AGE[i] + 42;
        PPOS[i3] = RX + (Math.random() - .5) * (riser.h - 0.14);
        PPOS[i3 + 1] = y0 + 2.45;
        PPOS[i3 + 2] = RZ + (Math.random() - .5) * (riser.w - 0.1);
        continue;
      }
      const p = brPos(PS[i]);
      PPOS[i3] = p[0]; PPOS[i3 + 1] = y0 + p[1]; PPOS[i3 + 2] = p[2];
    } else if (st === STG.RISER) {
      const v = Math.max(0.45, Math.min(3.4, segFlowV(PPOS[i3 + 1]) * 0.34));
      PPOS[i3 + 1] += v * dt;
      PPOS[i3] += (Math.random() - .5) * .015;
      if (PPOS[i3 + 1] >= 16.55) { PSTG[i] = STG.PLUME; PLT[i] = Math.min(PLT[i], AGE[i] + 3.4); PVX[i] = wind; PVY[i] = 0.85; PVZ[i] = 0.12; }
    } else if (st === STG.PLUME) {
      PVY[i] = Math.max(0.32, PVY[i] - 0.22 * dt);
      PPOS[i3] += PVX[i] * dt + Math.sin(AGE[i] * 1.7 + i) * 0.1 * dt;
      PPOS[i3 + 1] += PVY[i] * dt;
      PPOS[i3 + 2] += PVZ[i] * dt;
      const kc = Math.min(1, dt * 0.26); // 缓慢渐向夜色背景，长时间保持鲜艳色相
      PCOL[i3] += (0.102 - PCOL[i3]) * kc; PCOL[i3 + 1] += (0.070 - PCOL[i3 + 1]) * kc; PCOL[i3 + 2] += (0.035 - PCOL[i3 + 2]) * kc;
    } else if (st === STG.BF_PIPE) {
      const v = 0.5 + Math.min(1.6, ST.units[ST.focus].leakQ / 28);
      PS[i] -= v * dt;
      if (PS[i] <= 0.43) { // 逆行到罩口，冒入厨房
        PSTG[i] = STG.BF_ROOM; PLT[i] = Math.min(PLT[i], AGE[i] + 5);
        PPOS[i3] = 2.4; PPOS[i3+1] = y0 + 1.5; PPOS[i3+2] = STZ; PVX[i] = (Math.random()-.5)*.5; PVZ[i] = .25+Math.random()*.4; PVY[i] = -.05; continue; }
      const p = brPos(Math.max(0.43, PS[i]));
      PPOS[i3] = p[0]; PPOS[i3 + 1] = y0 + p[1]; PPOS[i3 + 2] = p[2];
    } else if (st === STG.BF_ROOM) {
      PPOS[i3] += PVX[i] * dt * 1.6 + (Math.random() - .5) * .05;
      PPOS[i3 + 1] += PVY[i] * dt; PVY[i] = Math.max(-0.22, PVY[i] - 0.06 * dt);
      PPOS[i3 + 2] += PVZ[i] * dt * 1.2 + (Math.random() - .5) * .05;
      if (PPOS[i3 + 1] < y0 + 0.35) PPOS[i3 + 1] = y0 + 0.35;
      if (PPOS[i3] < 1.3) PPOS[i3] = 1.3; if (PPOS[i3] > 4.5) PPOS[i3] = 4.5;
      if (PPOS[i3 + 2] > -1.0) PPOS[i3 + 2] = -1.0;
    }
  }
  V3.pts.geometry.attributes.position.needsUpdate = true;
  V3.pts.geometry.attributes.color.needsUpdate = true;
  V3.pts.visible = true; // 烟流按钮已移除，恒显示
}
function brPos(s) { // 支管折线弧长定位（层内局部坐标）
  if (s <= 0.43) return [STX, 1.45 + s, STZ];        // 罩内上升
  if (s <= 1.0) return [STX, 1.88 + (s - 0.43), STZ]; // 垂直管
  return [STX + (s - 1.0), 2.45, STZ];                // 水平管→烟道
}

/* ---------- DOM 标签投影 ---------- */
const LBL = [];
function initLabels() {
  /* V2.1：楼层牌改为柜体 3D 贴片（见 buildUnits）；DOM 悬浮标签全部移除，
     节点压力/阀前后/出口流速/倒灌数值均在右侧监测面板。 */
}
const _pv = new THREE.Vector3();
let lblTxtT = 0;
function updateLabels(now) { /* DOM 标签已移除，保留空实现 */ }

/* ---------- 相机交互 ---------- */
function bindCam() { // 魔兽世界式操作
  v3c.addEventListener("mousedown", e => {
    V3.orb.auto = false;
    v3drag = (e.button === 2 || e.button === 0) && !e.shiftKey ? { t: "rot" } : { t: "pan" };
    v3drag.x = e.clientX; v3drag.y = e.clientY;
    e.preventDefault();
  });
  addEventListener("mousemove", e => {
    if (!v3drag || !V3) return;
    const dx = e.clientX - v3drag.x, dy = e.clientY - v3drag.y;
    v3drag.x = e.clientX; v3drag.y = e.clientY;
    const o = V3.orb;
    if (v3drag.t === "rot") { o.th += dx * 0.006; o.ph = Math.min(1.52, Math.max(0.06, o.ph - dy * 0.005)); }
    else {
      const s = o.dist * 0.0016;
      o.tx += -dx * s * Math.cos(o.th) + dy * s * Math.cos(o.ph) * Math.sin(o.th) * 0.8;
      o.tz += -dx * s * Math.sin(o.th) - dy * s * Math.cos(o.ph) * Math.cos(o.th) * 0.8;
      o.ty += dy * s * Math.sin(o.ph) * 0.8;
    }
  });
  addEventListener("mouseup", () => v3drag = null);
  v3c.addEventListener("contextmenu", e => e.preventDefault());
  v3c.addEventListener("wheel", e => { // 滚轮=放大/缩小
    e.preventDefault();
    V3.orb.auto = false;
    V3.orb.dist = Math.min(46, Math.max(3.5, V3.orb.dist * (e.deltaY > 0 ? 1.09 : 0.92)));
  }, { passive: false });
  addEventListener("keydown", e => { // W/S 前进后退 · A/D 左右平移
    const el = document.activeElement;
    if (el && /INPUT|SELECT|TEXTAREA/.test(el.tagName)) return;
    const k = { w: "w", a: "a", s: "s", d: "d", arrowup: "w", arrowleft: "a", arrowdown: "s", arrowright: "d" }[e.key.toLowerCase()];
    if (k) { V3KEYS[k] = true; e.preventDefault(); }
  });
  addEventListener("keyup", e => { const k = e.key.toLowerCase(); if ("wasd".includes(k)) V3KEYS[k] = false; });
  addEventListener("blur", () => V3KEYS = {});
}
function v3Resize() {
  const cv = $("cview");
  const w = Math.max(2, cv.clientWidth), h = Math.max(2, cv.clientHeight);
  V3.renderer.setSize(w, h, false);
  V3.camera.aspect = w / h; V3.camera.updateProjectionMatrix();
}
addEventListener("resize", () => { if (V3) v3Resize(); });

/* ---------- 阀片动画 / 压力计 / 3F 警示 ---------- */
function updateVisuals(dt, now) {
  ST.units.forEach((u, i) => {
    const tgt = (u.on && u.Q > 8) ? Math.min(1, u.Q / (0.55 * u.qMax)) : 0;
    u.valveTh += (tgt - u.valveTh) * Math.min(1, dt * 5);
    const d3 = V3.units3d[i];
    let rotY = u.valveTh * 1.31;
    if (u.leakQ > 0.3 && u.valveTh < 0.06) rotY = 0.05 + 0.045 * Math.sin(now * 0.009 + i);
    d3.valve.rotation.y = rotY;
  });
  // 压力计
  for (let i = 0; i < 5; i++) {
    const g = V3.gaugeArr[i], p = R.P[i];
    const hp = Math.min(1.08, Math.abs(p) / 250);
    g.pos.scale.y = Math.max(0.001, p > 0 ? hp : 0.0001);
    g.pos.position.y = g.gy + g.pos.scale.y / 2;
    g.neg.scale.y = Math.max(0.001, p < 0 ? hp : 0.0001);
    g.neg.position.y = g.gy - g.neg.scale.y / 2;
  }
  // 3F 状态环 + 厨房警示
  const st = f3Status();
  if (V3.f3RingMat) {
    const col = st.c === "ok" ? 0x4e7d52 : st.c === "warn" ? 0xc07a27 : st.c === "bad" ? 0xb3492f : 0x8b8478;
    V3.f3RingMat.color.setHex(col);
    V3.f3RingMat.emissive.setHex(col).multiplyScalar(0.45);
  }
  if (V3.f3Kitchen && V3.f3Kitchen.material.emissive) {
    const lk = ST.units[ST.focus].leakQ;
    const a = lk > 0.3 ? Math.min(1, lk / 12) * (0.5 + 0.5 * Math.sin(now * 0.004)) : 0;
    V3.f3Kitchen.material.emissive.setRGB(0.45 * a, 0.06 * a, 0.02 * a);
  }
}

/* ---------- 主循环 ---------- */
let uiT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  now = now || performance.now();
  const dt = Math.min((now - v3t0) / 1000, 0.05); v3t0 = now;
  const o = V3.orb;
  // 视角锁定，无自动旋转
  V3.camera.position.set(
    o.tx + o.dist * Math.sin(o.ph) * Math.cos(o.th),
    o.ty + o.dist * Math.cos(o.ph),
    o.tz + o.dist * Math.sin(o.ph) * Math.sin(o.th));
  V3.camera.lookAt(o.tx, o.ty, o.tz);
  const mv = o.dist * 0.9 * dt;
  // 魔兽世界式移动：W/S 沿视线水平前/后，A/D 左右平移
  if (V3KEYS.w || V3KEYS.s) { const f = V3KEYS.w ? 1 : -1; o.tx += f * -Math.cos(o.th) * mv; o.tz += f * -Math.sin(o.th) * mv; }
  if (V3KEYS.a || V3KEYS.d) { const g = V3KEYS.d ? 1 : -1; o.tx += g * Math.sin(o.th) * mv; o.tz += g * -Math.cos(o.th) * mv; }
  // 数值平滑（粒子/显示用）
  ST.units.forEach(u => u.Qdisp += (u.Q - u.Qdisp) * Math.min(1, dt * 3.5));
  updateParticles(dt);
  updateVisuals(dt, now);
  updateLabels(now);
  if (now - uiT > 240) { uiT = now; refreshLeftDyn(); refreshRight(); }
  V3.renderer.render(V3.scene, V3.camera);
}

/* ---------- 启动 ---------- */
buildCards();
init3D();
applyPreset("peak");
showHelp(true); // 启动=地精科技弹框（完整说明在顶栏「说明」）
v3t0 = performance.now();
requestAnimationFrame(loop);

</script>
