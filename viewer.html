<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>加密阅读 · elf_D老肖的世界</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lock">

  <!-- 密码门 -->
  <div class="gate" id="gate" style="display:none;">
    <div class="gate-box">
      <p class="sec-label" style="justify-content:center;margin-bottom:16px;">Protected</p>
      <h1>加密资料</h1>
      <p>本页面为受保护的产品手册，请输入访问密码。</p>
      <input type="password" id="pwInput" placeholder="请输入访问密码" autocomplete="off">
      <button class="btn btn-solid" id="pwBtn" style="width:100%;">进入阅读</button>
      <p class="gate-msg" id="pwMsg"></p>
    </div>
  </div>

  <!-- 阅读器 -->
  <div class="viewer-wrap" id="viewer" style="display:none;">
    <header class="vbar">
      <a class="vback" href="database.html">← 返回资料库</a>
      <h1 id="vTitle"></h1>
      <div class="vcontrols">
        <button id="prevPage" title="上一页">‹</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPage" title="下一页">›</button>
        <input type="number" id="pageJump" min="1" title="跳转页码">
        <button id="zoomOut" title="缩小">−</button>
        <span id="zoomInfo">100%</span>
        <button id="zoomIn" title="放大">+</button>
        <span class="vbadge">🔒 禁止下载 · 请勿截图传播</span>
      </div>
    </header>
    <div class="vstage" id="vstage">
      <div class="vpage" id="vpage">
        <canvas id="vcanvas"></canvas>
        <div class="watermark"><span id="wmText"></span></div>
      </div>
    </div>
  </div>

  <script src="js/viewer-config.js"></script>
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
